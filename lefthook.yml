# Git hooks via lefthook. Install with `lefthook install` (done automatically in the nix dev shell).

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    typos:
      run: typos --force-exclude {staged_files}
    taplo:
      glob: "*.toml"
      run: taplo check {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}

# Sequential and fail-fast: clippy and nextest contend for the same target/ lock,
# so parallel buys little; cheapest checks run first.
pre-push:
  piped: true
  commands:
    fmt:
      priority: 1
      run: cargo fmt --all -- --check
    clippy:
      priority: 2
      run: cargo clippy --workspace -- -D warnings
    test:
      priority: 3
      run: cargo nextest run --workspace
