name: Nix CI shell
description: Install Nix, use the cosmos-mercury Cachix cache, and load the .#ci dev shell into the job environment
inputs:
  cachix-auth-token:
    description: Cachix auth token; without it the cache is pull-only (e.g. fork PRs)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@main

    - uses: cachix/cachix-action@v16
      with:
        name: cosmos-mercury
        authToken: ${{ inputs.cachix-auth-token }}

    - uses: nicknovitski/nix-develop@v1
      with:
        arguments: .#ci
