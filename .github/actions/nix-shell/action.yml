name: Nix CI shell
description: Install Nix, use the cosmos-mercury Cachix cache, and load the .#ci dev shell into the job environment
inputs:
  cachix-auth-token:
    description: Cachix auth token; without it the cache is pull-only (e.g. fork PRs)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

    - uses: cachix/cachix-action@v16
      with:
        name: cosmos-mercury
        authToken: ${{ inputs.cachix-auth-token }}
        # Skip per-commit crane artifacts (vendored deps, deps build, the relayer itself); cache toolchains only.
        pushFilter: "(mercury-|vendor-cargo|cargo-package-|cargo-git)"

    - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
      with:
        arguments: .#ci
